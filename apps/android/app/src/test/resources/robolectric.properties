# Robolectric 4.16's newest supported platform is API 36; this project's
# targetSdk is 37 (required by several AndroidX libraries), which Robolectric
# rejects with "Package targetSdkVersion=37 > maxSdkVersion=36". None of the
# Robolectric-backed tests depend on SDK-37-specific behavior, so pin the
# emulated platform to the highest one Robolectric actually ships.
sdk=36
