org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9's built-in Kotlin support (and the new `android.newDsl` block it
# requires) is new territory with its own DSL for Compose/kapt/serialization
# interop; opting out of both keeps the well-understood, explicit
# org.jetbrains.kotlin.android + subplugins wiring this project already
# uses, matching AGP's own documented escape hatch.
android.builtInKotlin=false
android.newDsl=false
